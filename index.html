<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      transition: color 0.3s ease;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1 id="greeting">Hello</h1>
  <button id="color-btn">Change color</button>

  <script>
    const colors = ["#e63946", "#2a9d8f", "#e9c46a", "#457b9d", "#9b5de5"];
    let index = 0;

    document.getElementById("color-btn").addEventListener("click", () => {
      document.getElementById("greeting").style.color = colors[index];
      index = (index + 1) % colors.length;
    });
  </script>
</body>
</html>
